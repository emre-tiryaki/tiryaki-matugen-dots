# Generated by Matugen.
# Do not edit manually.

general {
   hide_cursor = true
   ignore_empty_input = true
   text_trim = true
}

background {
   path = screenshot

   blur_passes = 2
   contrast = 0.8916
   brightness = 0.7172
   vibrancy = 0.1696
   vibrancy_darkness = 0
}

input-field {
   monitor = eDP-1

   size = 250, 60
   outline_thickness = 2

   outer_color = rgb(899295)
   inner_color = rgb(0f1416)
   font_color = rgb(dee3e6)

   dots_size = 0.1
   dots_spacing = 1
   dots_center = true

   fade_on_empty = false
   hide_input = false

   placeholder_text =  $USER

   position = 0, -470
   halign = center
   valign = center

   zindex = 10
}

label {
   text = cmd[update:1000] echo -e "$(date +"%H")"

   color = rgb(85d2e8)

   font_size = 150
   font_family = AlfaSlabOne

   position = 0, -250

   halign = center
   valign = top
}

label {
   text = cmd[update:1000] echo -e "$(date +"%M")"

   color = rgb(85d2e8)

   font_size = 150
   font_family = AlfaSlabOne

   position = 0, -420

   halign = center
   valign = top
}

label {
   text = cmd[update:1000] echo -e "$(date +"%d %b %A")"

   color = rgb(bfc8cb)

   font_size = 14
   font_family = JetBrains Mono Nerd Font Mono ExtraBold

   position = 0, -130

   halign = center
   valign = center
}

# LOCATION & WEATHER
label {
   text = cmd[update:60000] cat ~/.cache/hyprlock/location-weather 2>/dev/null

   color = rgb(bfc8cb)

   font_size = 12
   font_family = JetBrains Mono Nerd Font Mono

   position = 0, 465

   halign = center
   valign = center
}
